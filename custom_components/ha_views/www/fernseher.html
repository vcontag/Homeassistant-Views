<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="pwa/fernseher.webmanifest">
<meta name="theme-color" content="#ECEFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="pwa/fernseher-192.png">
<script src="ha-token.js"></script>
<title>Fernseher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF4; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#14213D; --muted:#5A6781; --line:#D5DBE6;
  --accent:#1B4FA0; --accent-ink:#FFFFFF; --accent-soft:#DCE6F6;
  --ok:#2E8B57; --warn:#B7790A; --bad:#C23B3B;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#1A2130; --surface-2:#212A3B; --ink:#E5EAF3; --muted:#95A1B8; --line:#2C3749;
    --accent:#6E9BEA; --accent-ink:#0C1830; --accent-soft:#1E2F4F; --ok:#4CC282; --warn:#E3A93A; --bad:#EF6B6B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#1A2130; --surface-2:#212A3B; --ink:#E5EAF3; --muted:#95A1B8; --line:#2C3749;
  --accent:#6E9BEA; --accent-ink:#0C1830; --accent-soft:#1E2F4F; --ok:#4CC282; --warn:#E3A93A; --bad:#EF6B6B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Manrope,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button,a,select,input{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 48px}

header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;align-items:start;margin-bottom:16px}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.85rem;display:flex;align-items:center;gap:6px;margin-top:3px}
.meta i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.meta.on i{background:var(--ok)} .meta.err i{background:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.icon{width:40px;padding:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.btn:active:not(:disabled),.pad button:active:not(:disabled){transform:scale(.96)}
@media (hover:hover){.btn:hover{border-color:var(--muted)} .src:hover{border-color:var(--muted)}}

/* Kopfblock */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:16px}
.htop{display:flex;align-items:center;gap:16px}
.power{width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;flex:none;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 3px var(--line);transition:background .2s,color .2s}
.power svg{width:28px;height:28px}
.power.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.htxt{min-width:0}
.htxt .st{font-size:1.25rem;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.htxt .sub{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.vol{display:grid;gap:8px}
.vtop{display:flex;align-items:baseline;justify-content:space-between}
.vtop label{font-weight:700}
.vtop b{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.vtop b.muted{color:var(--muted);text-decoration:line-through}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--accent);margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.vbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vbtns .btn{min-height:48px;font-size:1.1rem;white-space:nowrap}
.vbtns .btn[data-mute]{font-size:.95rem}
.vbtns .btn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.hint{font-size:.82rem;color:var(--muted);margin:0}

section{margin-top:22px}
section > h2{font-size:1.05rem;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.off-note{color:var(--muted);font-size:.85rem;font-weight:600;margin-left:auto}
.dim{opacity:.45;pointer-events:none}

/* Fernbedienung */
.remote{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:16px;justify-items:center}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:360px}
.row .btn{min-height:50px;flex-direction:column;gap:2px;font-size:.8rem;padding:6px 4px}
.pad{position:relative;width:228px;height:228px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.pad button{position:absolute;border:0;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;border-radius:12px}
.pad button svg{width:26px;height:26px}
.pad .u{top:6px;left:50%;width:76px;height:64px;margin-left:-38px}
.pad .d{bottom:6px;left:50%;width:76px;height:64px;margin-left:-38px}
.pad .l{left:6px;top:50%;width:64px;height:76px;margin-top:-38px}
.pad .r{right:6px;top:50%;width:64px;height:76px;margin-top:-38px}
.pad .ok{left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:1.05rem;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.rock{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:360px;align-items:stretch}
.rocker{display:grid;grid-template-rows:1fr auto 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:center}
.rocker button{border:0;background:none;font-size:1.3rem;font-weight:800;min-height:52px;cursor:pointer;color:var(--ink)}
.rocker svg{width:24px;height:24px}
.rocker button{display:grid;place-items:center}
.rocker span{font-size:.72rem;font-weight:700;color:var(--muted);padding:2px 0}
.mid{display:grid;gap:10px}
.mid .btn{min-height:47px}
.mid .btn.on{background:var(--bad);border-color:var(--bad);color:#fff}
.media{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:360px}
.media .btn{min-height:46px;padding:0}
details.nums{width:100%;max-width:360px}
details.nums summary{cursor:pointer;color:var(--muted);font-weight:700;font-size:.9rem;text-align:center;list-style:none;padding:6px}
details.nums summary::-webkit-details-marker{display:none}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.numpad .btn{min-height:50px;font-size:1.2rem;font-weight:800}

.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.src{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-weight:700;cursor:pointer;min-height:52px;text-align:left;overflow-wrap:anywhere}
.src[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chan{display:flex;gap:8px}
.chan input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:14px;width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px)}
dialog::backdrop{background:rgba(8,14,26,.5)}
.dh{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;flex:1;font-size:1.15rem}
.dh p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.db{padding:16px 20px 20px;display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label{font-size:.85rem;font-weight:600}
.field input{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}

/* Am PC: Fernbedienung und Quellen nebeneinander */
@media (min-width:860px){
  .cols{display:grid;grid-template-columns:400px minmax(0,1fr);gap:20px;align-items:start}
}
/* ===== Handy ===== */
@media (max-width:640px){
  .wrap{padding:12px 12px 32px}
  input,select,textarea{font-size:16px!important}
  h1{font-size:1.35rem}
  .btn{min-height:44px} .btn.icon{width:44px;height:44px}
  .hero,.remote{padding:14px;border-radius:16px}
  .power{width:56px;height:56px}
  .srcs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .src{padding:10px;min-height:48px;font-size:.92rem}
  section{margin-top:18px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
  dialog[open]{animation:sheet .22s ease-out}
  dialog::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
  .dh{padding:12px 16px 10px} .db{padding:14px 16px 20px}
}
@keyframes sheet{from{transform:translateY(48px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none!important}.power{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title">Fernseher</h1><div class="meta" id="meta"><i></i><span>Nicht verbunden</span></div></div>
    <button class="btn icon" id="setBtn" aria-label="Einstellungen" title="Einstellungen">⚙</button>
  </header>
  <main id="main"></main>
</div>

<dialog id="setDlg" aria-labelledby="setTitle">
  <form method="dialog" id="setForm">
    <div class="dh"><div style="flex:1"><h2 id="setTitle">Verbindung zu Home Assistant</h2><p>Wird nur in diesem Browser gespeichert.</p></div>
      <button class="btn icon" value="cancel" aria-label="Schließen">✕</button></div>
    <div class="db">
      <div class="field"><label for="cfgUrl">Adresse von Home Assistant</label><input id="cfgUrl" type="url" required></div>
      <div class="field"><label for="cfgToken">Langlebiges Zugriffstoken</label><input id="cfgToken" type="password" autocomplete="off" placeholder="Leer lassen für HA-Anmeldung">
        <p class="hint">Nur nötig, wenn du in diesem Browser nicht bei Home Assistant angemeldet bist.</p></div>
      <div style="display:flex;justify-content:flex-end"><button class="btn primary" value="ok">Verbinden</button></div>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let tt;
function toast(msg, err){
  document.querySelector('.toast')?.remove();
  const el = Object.assign(document.createElement('div'), {className:'toast' + (err ? ' err' : ''), textContent:msg});
  el.setAttribute('role', 'status'); document.body.append(el);
  clearTimeout(tt); tt = setTimeout(() => el.remove(), err ? 6000 : 2200);
}

/* ---------- Anmeldung ----------
   Die Seite nutzt automatisch die Anmeldung von Home Assistant aus diesem Browser.
   Optional kannst du in der Datei ha-token.js ein langlebiges Token eintragen, dann funktionieren
   alle Seiten auf jedem Gerät ohne Anmeldung (nur im lokalen Netz empfehlenswert). */
const FIXED_TOKEN = window.HA_FIXED_TOKEN || '';

async function getToken(manual){
  if (FIXED_TOKEN) return {token: FIXED_TOKEN, via: 'festes Token'};
  // 1. Als Dashboard in HA eingebettet (Seitenleiste, Companion-App): Anmeldung der HA-Oberfläche mitbenutzen
  try {
    const auth = window.parent !== window && window.parent.document.querySelector('home-assistant')?.hass?.auth;
    if (auth) { if (auth.expired) await auth.refreshAccessToken(); return {token: auth.accessToken, via: 'HA-Anmeldung'}; }
  } catch {}
  // 2. Direkt geöffnet: gespeicherte HA-Anmeldung ("Angemeldet bleiben") verwenden und bei Bedarf erneuern
  try {
    const t = JSON.parse(localStorage.getItem('hassTokens'));
    if (t?.refresh_token) {
      if (!t.expires || t.expires < Date.now() + 60000) {
        const r = await fetch((t.hassUrl || location.origin) + '/auth/token', {
          method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: new URLSearchParams({grant_type: 'refresh_token', client_id: t.clientId || location.origin + '/', refresh_token: t.refresh_token})
        });
        if (!r.ok) throw new Error('refresh');
        const n = await r.json();
        Object.assign(t, {access_token: n.access_token, expires_in: n.expires_in, expires: Date.now() + n.expires_in * 1000});
        localStorage.setItem('hassTokens', JSON.stringify(t));
      }
      return {token: t.access_token, via: 'HA-Anmeldung'};
    }
  } catch {}
  // 3. Token aus den Einstellungen dieser Seite
  return manual ? {token: manual, via: 'eigenes Token'} : null;
}
const NO_LOGIN = 'Keine Anmeldung gefunden. Öffne Home Assistant einmal in diesem Browser und melde dich mit „Angemeldet bleiben“ an, oder trag in den Einstellungen ein Token ein.';

const cfg = Object.assign({url:'', token:''}, load('zbm:cfg') || {}, load('car:cfg') || {}, load('wash:cfg') || {}, load('robo:cfg') || {}, load('avr:cfg') || {}, load('tv:cfg') || {});
if (location.protocol.startsWith('http')) cfg.url = location.origin;

const S = {entities:[], devices:[], states:new Map()};
let ws, msgId = 0; const pending = new Map();
function setMeta(kind, text){ const m = $('#meta'); m.className = 'meta ' + kind; m.querySelector('span').textContent = text; }

async function connect(){
  if (ws) { ws.onclose = null; ws.close(); }
  setMeta('', 'Verbinde …');
  const auth = await getToken(cfg.token);
  if (!cfg.url || !auth) { setMeta('err', 'Nicht angemeldet'); showError(NO_LOGIN); return; }
  ws = new WebSocket(cfg.url.replace(/^http/i, 'ws').replace(/\/+$/, '') + '/api/websocket');
  let authed = false;
  ws.onmessage = async e => {
    const m = JSON.parse(e.data);
    if (m.type === 'auth_required') ws.send(JSON.stringify({type:'auth', access_token:auth.token}));
    else if (m.type === 'auth_invalid') { setMeta('err', 'Anmeldung abgelehnt'); showError('Die Anmeldung wurde abgelehnt. Melde dich in Home Assistant neu an oder trag ein neues Token ein.'); }
    else if (m.type === 'auth_ok') {
      authed = true; S.via = auth.via;
      send({type:'subscribe_events', event_type:'state_changed'}).catch(() => {});
      try { await loadAll(); } catch (err) { showError(err.message); }
    }
    else if (m.type === 'result') { const p = pending.get(m.id); if (p) { pending.delete(m.id); m.success ? p.res(m.result) : p.rej(new Error(m.error?.message || 'Fehler')); } }
    else if (m.type === 'event' && m.event.event_type === 'state_changed') {
      const {entity_id, new_state} = m.event.data;
      if (!S.mine?.has(entity_id)) return;
      new_state ? S.states.set(entity_id, new_state) : S.states.delete(entity_id);
      scheduleRender();
    }
  };
  ws.onerror = () => { if (!authed) { setMeta('err', 'Nicht verbunden'); showError('Keine Verbindung zu ' + cfg.url + '.'); } };
  ws.onclose = () => { if (authed) { setMeta('err', 'Verbindung verloren, neuer Versuch …'); setTimeout(connect, 5000); } };
}
function send(msg){
  return new Promise((res, rej) => {
    if (!ws || ws.readyState !== 1) return rej(new Error('Nicht verbunden'));
    const id = ++msgId; pending.set(id, {res, rej}); ws.send(JSON.stringify({...msg, id}));
  });
}
const call = (domain, service, data) => send({type:'call_service', domain, service, service_data:data});

async function loadAll(){
  const [devices, entities, states] = await Promise.all([
    send({type:'config/device_registry/list'}), send({type:'config/entity_registry/list'}), send({type:'get_states'})]);
  const tvDevs = new Set(devices.filter(d => (d.identifiers || []).some(([dom]) => dom === 'samsungtv')).map(d => d.id));
  S.entities = entities.filter(e => !e.disabled_by && (e.platform === 'samsungtv' || tvDevs.has(e.device_id)));
  S.devices = devices.filter(d => tvDevs.has(d.id) || S.entities.some(e => e.device_id === d.id));
  S.mine = new Set(S.entities.map(e => e.entity_id));
  S.states = new Map(states.filter(s => S.mine.has(s.entity_id)).map(s => [s.entity_id, s]));
  render();
}

/* ---------- Hilfen ---------- */
const st = id => S.states.get(id?.entity_id || id);
const player = () => S.entities.find(e => e.entity_id.startsWith('media_player.'));
const remoteE = () => S.entities.find(e => e.entity_id.startsWith('remote.'));
const dev = () => S.devices.find(d => d.id === player()?.device_id) || S.devices[0];
const isOn = s => s && !['off', 'standby', 'unavailable', 'unknown'].includes(s.state);
const SRC_DE = {TV:'Fernsehen', HDMI:'HDMI', 'HDMI1':'HDMI 1', 'HDMI2':'HDMI 2', 'HDMI3':'HDMI 3', 'HDMI4':'HDMI 4'};
const srcDe = s => SRC_DE[String(s).toUpperCase().replace(/\s+/g, '')] || s;
const I = {
  power:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
  src:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M12 17v3M8 20h8"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
  guide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>',
  rew:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12l-8-6zM20 6v12l-8-6z"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  ff:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6v12l8-6zM13 6v12l8-6z"/></svg>'
};

/* ---------- Darstellung ---------- */
let rt; function scheduleRender(){ clearTimeout(rt); rt = setTimeout(render, 200); }
function showError(msg){ $('#main').innerHTML = `<div class="empty">${esc(msg)}<br><button class="btn primary" onclick="openSettings()">Einstellungen öffnen</button></div>`; }
const key = (k, inner, cls = '', extra = '') => `<button class="${cls}" data-key="${k}" ${extra}>${inner}</button>`;

function render(){
  const p = player();
  if (!p) { $('#main').innerHTML = '<div class="empty">Kein Samsung-Fernseher gefunden.</div>'; return; }
  const ae = document.activeElement;
  if (ae && $('#main').contains(ae) && ((ae.type === 'range' && S.dragging) || ae.id === 'chanIn')) { S.pendingRender = true; return; }
  const d = dev(), s = st(p), on = isOn(s), id = p.entity_id;
  const name = d?.name_by_user || (s?.attributes.friendly_name) || d?.name || 'Fernseher';
  $('#title').textContent = name; document.title = name;
  setMeta('on', [d?.manufacturer || 'Samsung', d?.model, S.via ? 'über ' + S.via : ''].filter(Boolean).join(', '));

  const src = s?.attributes.source, app = s?.attributes.app_name, title = s?.attributes.media_title;
  const lvl = s?.attributes.volume_level, muted = s?.attributes.is_volume_muted;
  const vol = lvl != null ? Math.round(lvl * 100) : null;
  let html = `<div class="hero">
    <div class="htop"><button class="power ${on ? 'on' : ''}" data-power="1" aria-pressed="${on}" aria-label="${on ? 'Ausschalten' : 'Einschalten'}">${I.power}</button>
      <div class="htxt"><div class="st">${!s || s.state === 'unavailable' ? (s?.state === 'unavailable' ? 'Aus' : 'Nicht erreichbar') : on ? esc(app || (src ? srcDe(src) : 'An')) : 'Aus'}</div>
      <div class="sub">${on ? esc(title || (app && src ? srcDe(src) : '') || 'Läuft') : 'Zum Einschalten tippen'}</div></div></div>
    <div class="vol ${on ? '' : 'dim'}">
      <div class="vtop"><label>Lautstärke</label><b class="${muted ? 'muted' : ''}" id="vval">${vol != null ? vol : '–'}</b></div>
      ${vol != null ? `<input type="range" min="0" max="100" step="1" value="${vol}" style="--p:${vol}%" data-vol="1" aria-label="Lautstärke">` : ''}
      <div class="vbtns">${key('KEY_VOLDOWN', '−', 'btn', 'data-repeat="1" aria-label="Leiser"')}
        <button class="btn ${muted ? 'on' : ''}" data-mute="1" aria-pressed="${!!muted}">🔇 Stumm</button>
        ${key('KEY_VOLUP', '+', 'btn', 'data-repeat="1" aria-label="Lauter"')}</div>
    </div>
  </div>`;

  // Fernbedienung
  const remote = `<section><h2>Fernbedienung${on ? '' : '<span class="off-note">Fernseher ist aus</span>'}</h2>
    <div class="remote ${on ? '' : 'dim'}">
      <div class="row">${key('KEY_SOURCE', I.src + 'Quelle', 'btn')}${key('KEY_HOME', I.home + 'Home', 'btn')}${key('KEY_MENU', I.menu + 'Menü', 'btn')}</div>
      <div class="pad">
        ${key('KEY_UP', I.up, 'u', 'data-repeat="1" aria-label="Hoch"')}${key('KEY_DOWN', I.down, 'd', 'data-repeat="1" aria-label="Runter"')}
        ${key('KEY_LEFT', I.left, 'l', 'data-repeat="1" aria-label="Links"')}${key('KEY_RIGHT', I.right, 'r', 'data-repeat="1" aria-label="Rechts"')}
        ${key('KEY_ENTER', 'OK', 'ok')}
      </div>
      <div class="row">${key('KEY_RETURN', I.back + 'Zurück', 'btn')}${key('KEY_INFO', I.info + 'Info', 'btn')}${key('KEY_GUIDE', I.guide + 'TV-Guide', 'btn')}</div>
      <div class="rock">
        <div class="rocker">${key('KEY_VOLUP', '+', '', 'data-repeat="1" aria-label="Lauter"')}<span>LAUT</span>${key('KEY_VOLDOWN', '−', '', 'data-repeat="1" aria-label="Leiser"')}</div>
        <div class="mid">${key('KEY_EXIT', 'Beenden', 'btn')}${key('KEY_TOOLS', 'Extras', 'btn')}</div>
        <div class="rocker">${key('KEY_CHUP', I.up, '', 'data-repeat="1" aria-label="Programm hoch"')}<span>PROG</span>${key('KEY_CHDOWN', I.down, '', 'data-repeat="1" aria-label="Programm runter"')}</div>
      </div>
      <div class="media">${key('KEY_REWIND', I.rew, 'btn', 'aria-label="Zurückspulen"')}${key('KEY_PLAY', I.play, 'btn', 'aria-label="Abspielen"')}${key('KEY_PAUSE', I.pause, 'btn', 'aria-label="Pause"')}${key('KEY_FF', I.ff, 'btn', 'aria-label="Vorspulen"')}</div>
      <details class="nums" ${S.numsOpen ? 'open' : ''}><summary>Zifferntasten</summary>
        <div class="numpad">${[1,2,3,4,5,6,7,8,9].map(n => key('KEY_' + n, n, 'btn')).join('')}${key('KEY_CH_LIST', 'Liste', 'btn')}${key('KEY_0', 0, 'btn')}${key('KEY_PRECH', 'Vorh.', 'btn')}</div></details>
    </div></section>`;

  // Quellen & Apps
  const sources = s?.attributes.source_list || [];
  const side = `${sources.length ? `<section><h2>Quellen & Apps</h2><div class="srcs ${on ? '' : 'dim'}">${sources.map(x =>
      `<button class="src" data-src="${esc(x)}" aria-pressed="${on && (x === src || x === app)}">${esc(srcDe(x))}</button>`).join('')}</div></section>` : ''}
    <section><h2>Sender direkt wählen</h2><div class="chan ${on ? '' : 'dim'}"><input id="chanIn" type="number" inputmode="numeric" min="1" placeholder="z. B. 1" aria-label="Programmnummer">
      <button class="btn primary" id="chanGo">Umschalten</button></div></section>`;

  html += `<div class="cols"><div>${remote}</div><div>${side}</div></div>`;
  $('#main').innerHTML = html;
  $('#main').querySelector('details.nums')?.addEventListener('toggle', e => { S.numsOpen = e.target.open; });
  S.pendingRender = false;
}

/* ---------- Aktionen ---------- */
async function run(fn, msg){
  try { await fn(); if (msg) toast(msg); }
  catch (err) { toast('Fehlgeschlagen: ' + err.message, true); }
}
function sendKey(k){
  if (navigator.vibrate) navigator.vibrate(8);
  const r = remoteE(), p = player();
  return r ? call('remote', 'send_command', {entity_id:r.entity_id, command:k})
           : call('media_player', 'play_media', {entity_id:p.entity_id, media_content_type:'send_key', media_content_id:k});
}
// Tasten: kurz tippen = einmal, gedrückt halten = wiederholen (für Pfeile, Lautstärke, Programm)
let holdT, holdI, held = false;
$('#main').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-key][data-repeat]'); if (!b) return;
  held = false;
  holdT = setTimeout(() => { held = true; holdI = setInterval(() => sendKey(b.dataset.key).catch(() => {}), 220); }, 450);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => $('#main').addEventListener(ev, () => { clearTimeout(holdT); clearInterval(holdI); }, true));
$('#main').addEventListener('contextmenu', e => { if (e.target.closest('[data-key]')) e.preventDefault(); });

$('#main').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset, p = player();
  if (d.key) { if (held) { held = false; return; } return run(() => sendKey(d.key)); }
  if (d.power) {
    const on = isOn(st(p));
    return run(() => call('media_player', on ? 'turn_off' : 'turn_on', {entity_id:p.entity_id}), on ? 'Wird ausgeschaltet' : 'Wird eingeschaltet …');
  }
  if (d.mute) { const m = !!st(p)?.attributes.is_volume_muted; return run(() => call('media_player', 'volume_mute', {entity_id:p.entity_id, is_volume_muted:!m})); }
  if (d.src) return run(() => call('media_player', 'select_source', {entity_id:p.entity_id, source:d.src}), srcDe(d.src));
  if (t.id === 'chanGo') {
    const n = $('#chanIn').value.trim(); if (!n) return;
    $('#chanIn').blur(); $('#chanIn').value = '';
    return run(() => call('media_player', 'play_media', {entity_id:p.entity_id, media_content_type:'channel', media_content_id:n}), 'Programm ' + n);
  }
});
$('#main').addEventListener('keydown', e => { if (e.target.id === 'chanIn' && e.key === 'Enter') $('#chanGo').click(); });
$('#main').addEventListener('input', e => {
  if (!e.target.dataset.vol) return;
  S.dragging = true; e.target.style.setProperty('--p', e.target.value + '%'); $('#vval').textContent = e.target.value;
});
$('#main').addEventListener('change', e => {
  if (!e.target.dataset.vol) return;
  S.dragging = false;
  run(() => call('media_player', 'volume_set', {entity_id:player().entity_id, volume_level:+e.target.value / 100}));
  e.target.blur(); if (S.pendingRender) scheduleRender();
});
$('#main').addEventListener('focusout', e => { if (e.target.id === 'chanIn' && S.pendingRender) scheduleRender(); });

function openSettings(){ $('#cfgUrl').value = cfg.url; $('#cfgToken').value = cfg.token || ''; $('#setDlg').showModal(); }
$('#setBtn').onclick = openSettings;
$('#setForm').addEventListener('submit', e => {
  if (e.submitter?.value !== 'ok') return;
  cfg.url = $('#cfgUrl').value.trim().replace(/\/+$/, ''); cfg.token = $('#cfgToken').value.trim();
  save('tv:cfg', {url:cfg.url, token:cfg.token}); connect();
});
connect();
</script>
</body>
</html>
